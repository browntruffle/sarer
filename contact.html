<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Alex Benjamin Kyeyune</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="particles" id="particles"></div>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Alex Benjamin Kyeyune</a>
      <nav>
        <a href="about.html">About</a>
        <a href="index.html#videos">Videos</a>
        <a href="index.html#shorts">Shorts</a>
        <a href="contact.html">Contact</a>
        <a href="https://www.youtube.com/channel/UCUcbceZxb_OnDpgSJAOsXEA" target="_blank" rel="noopener">YouTube</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="contact-section">
      <div class="container">
        <div class="reveal">
          <h1>Get in Touch</h1>
          <p class="sub">Collabs, questions, or just want to talk — send me a message.</p>

          <form class="contact-form" id="contact-form"
                action="https://formspree.io/f/REPLACE_WITH_YOUR_ID"
                method="POST">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Your name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="your@email.com" required />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
            </div>
            <div class="form-submit">
              <button type="submit" class="btn">Send Message</button>
            </div>
          </form>

          <div class="form-success" id="form-success">
            ✓ Message sent — I'll get back to you soon.
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>© <span id="year"></span> Alex Benjamin Kyeyune</div>
      <div class="social">
        <a href="https://twitter.com/alexbkyeyune" target="_blank" rel="noopener">Twitter</a>
        <a href="https://instagram.com/cheiune" target="_blank" rel="noopener">Instagram</a>
        <a href="https://tiktok.com/@alexbenjaminkyeyune" target="_blank" rel="noopener">TikTok</a>
        <a href="https://www.youtube.com/channel/UCUcbceZxb_OnDpgSJAOsXEA" target="_blank" rel="noopener">YouTube</a>
      </div>
    </div>
  </footer>

  <script src="js/scripts.js"></script>
  <script>
    const form = document.getElementById('contact-form');
    const success = document.getElementById('form-success');
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]');
      btn.textContent = 'Sending…';
      btn.disabled = true;
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          form.style.display = 'none';
          success.style.display = 'block';
        } else {
          btn.textContent = 'Send Message';
          btn.disabled = false;
          alert('Something went wrong. Try emailing directly: alexbenjaminkyeyune@gmail.com');
        }
      } catch(err) {
        btn.textContent = 'Send Message';
        btn.disabled = false;
        alert('Something went wrong. Try emailing directly: alexbenjaminkyeyune@gmail.com');
      }
    });
  </script>
</body>
</html>
